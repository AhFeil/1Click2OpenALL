name: Build Release Zip

on:
  push:
    branches: [ main ]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          mkdir dist
          zip -r dist/oneclick.zip . \
            -x "justfile*" "config.yaml" "*.service"\
            -x "*.git*" \
            -x "__pycache__*" "*.pyc" ".env/" ".venv/" ".env/*" ".venv/*" \
            -x ".github/*" ".github/" \
            -x "dist/*" "dist/"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/oneclick.zip
          overwrite_files: true
